# Despliegue de QReaper en el VPS de b-dev.es.
#
#   - No publica puertos: la única puerta es Traefik (stack de /opt/bdev).
#   - Se engancha a la red externa `bdev_default` para que Traefik lo vea.
#   - Sandbox desactivado (QREAPER_SANDBOX=off): no detona URLs en producción.
#   - La BD SQLite persiste en el volumen `qreaper-data`.
#
# Uso:
#   cd /opt/qreaper
#   docker compose -f deploy/docker-compose.vps.yml up -d --build

services:

  qreaper-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      QREAPER_SANDBOX: "off"
    volumes:
      - qreaper-data:/data
    mem_limit: 400m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - "traefik.http.routers.qreaper.rule=Host(`qreaper.b-dev.es`)"
      - traefik.http.routers.qreaper.entrypoints=websecure
      - traefik.http.routers.qreaper.tls.certresolver=le
      - traefik.http.services.qreaper.loadbalancer.server.port=8000
      - traefik.http.routers.qreaper.middlewares=secheaders@docker
    networks: [bdev]

volumes:
  qreaper-data:

networks:
  bdev:
    external: true
    name: bdev_default
